server {
    listen 80;
    server_name localhost;

    # Keep the original port (e.g. 8090) in redirects like /wp-admin -> /wp-admin/
    absolute_redirect off;

    # Inherited by every location without its own add_header, i.e. all PHP responses.
    # The CSP has no script/frame allowlist, so embeds in old posts keep working.
    # Browsers ignore HSTS over plain HTTP, so local dev is unaffected.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Docker's embedded DNS; re-resolve php when its container is recreated with a new IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~* ^/wp-content/themes/.+/assets/.+\.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Not immutable: Enable Media Replace can swap a file under the same name
    location ~* \.(js|css|ico|svg|woff|woff2|ttf|eot|jpe?g|png|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
