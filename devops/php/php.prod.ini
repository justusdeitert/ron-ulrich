upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300

; Never leak PHP warnings/notices into HTML responses (WP_DEBUG_DISPLAY only
; takes effect when WP_DEBUG is on; this guarantees clean output regardless).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Code is baked into the image, so never re-check files for changes
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
